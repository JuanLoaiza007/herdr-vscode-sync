id = "local.herdr-vscode-sync"
name = "Herdr VS Code Sync"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Follow the focused Herdr workspace in a VS Code window"
platforms = ["linux", "macos"]

# Manual refresh + open:
[[actions]]
id = "collect"
title = "Write current workspace state"
contexts = ["workspace"]
command = ["bash", "bin/collect.sh"]

[[actions]]
id = "open"
title = "Open VS Code on the current workspace"
contexts = ["workspace"]
command = ["bash", "bin/startup.sh"]

# Follow: whenever Herdr switches focus (or a worktree lands/changes), write
# the now-focused workspace into current.json; the VS Code extension follows.
[[events]]
on = "workspace.focused"
command = ["bash", "bin/collect.sh"]

[[events]]
on = "worktree.created"
command = ["bash", "bin/collect.sh"]

[[events]]
on = "worktree.opened"
command = ["bash", "bin/collect.sh"]

[[events]]
on = "worktree.removed"
command = ["bash", "bin/collect.sh"]
